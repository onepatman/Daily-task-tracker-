<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1f33" />
<title>Daily Log — Task Tracker &amp; Planner</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <header class="titleblock">
    <div class="tb-nav">
      <button id="prevMonth" class="tb-arrow" aria-label="Previous month">‹</button>
      <button id="monthYearBtn" class="tb-monthyear" aria-label="Jump to today">
        <span id="monthLabel">AUGUST</span>
        <span id="yearLabel">2026</span>
      </button>
      <div class="tb-nav-right">
        <button id="themeToggle" class="tb-icon-btn" aria-label="Toggle light/dark theme">🌙</button>
        <div class="more-menu-wrap">
          <button id="moreMenuBtn" class="tb-icon-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false">⋮</button>
          <div class="more-menu" id="moreMenu" hidden>
            <button type="button" id="menuWeeklyReview">📊 Weekly review</button>
            <button type="button" id="menuPrint">🖨 Print sheet</button>
            <button type="button" id="menuExportJson">⇩ Export JSON</button>
            <button type="button" id="menuExportCsv">⇩ Export CSV</button>
            <button type="button" id="menuImport">⇧ Import JSON</button>
            <input type="file" id="importFileInput" accept="application/json" hidden />
          </div>
        </div>
        <button id="nextMonth" class="tb-arrow" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="tb-cells">
      <div class="tb-cell">
        <span class="tb-cell-label">SHEET</span>
        <span class="tb-cell-value" id="sheetDate">—</span>
      </div>
      <div class="tb-cell">
        <span class="tb-cell-label">DAY</span>
        <span class="tb-cell-value" id="sheetDay">—</span>
      </div>
      <div class="tb-cell tb-cell-status">
        <span class="tb-cell-label">STATUS</span>
        <span class="tb-cell-value" id="sheetStatus">0/0 DONE</span>
      </div>
    </div>
  </header>

  <div class="view-tabs" id="viewTabs" role="tablist" aria-label="View">
    <button type="button" class="view-tab active" data-view="day" role="tab" aria-selected="true">Day</button>
    <button type="button" class="view-tab" data-view="week" role="tab" aria-selected="false">Week</button>
    <button type="button" class="view-tab" data-view="timeline" role="tab" aria-selected="false">Timeline</button>
  </div>

  <div class="app-body">
    <aside class="app-sidebar">
      <button class="notify-pill" id="notifyPill" hidden>🔔 Enable reminder notifications</button>

      <section class="calendar" id="calendarSection">
        <div class="calendar-weekdays">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>
      <button class="calendar-toggle" id="calendarToggle">Hide calendar ▲</button>

      <section class="insights-panel" id="insightsPanel" hidden>
        <div class="insight-ring-wrap">
          <svg class="insight-ring" viewBox="0 0 64 64" width="64" height="64">
            <circle class="ring-track" cx="32" cy="32" r="27" />
            <circle class="ring-value" id="insightRingValue" cx="32" cy="32" r="27" />
          </svg>
          <div class="insight-ring-label">
            <span id="insightRingPct">0%</span>
            <span>today</span>
          </div>
        </div>
        <div class="insight-stats">
          <div class="insight-stat">
            <span class="insight-stat-value" id="insightStreak">0</span>
            <span class="insight-stat-label">day streak</span>
          </div>
          <div class="insight-sparkline" id="insightSparkline" aria-label="Last 7 days completion"></div>
        </div>
      </section>
      <button class="insights-toggle" id="insightsToggle">Show insights ▾</button>
    </aside>

    <div class="app-main">
      <div class="print-header">
        <h1>Daily Log</h1>
        <p id="printDate"></p>
      </div>

      <section class="toolbar" id="toolbar">
        <div class="toolbar-search">
          <span class="toolbar-search-icon">⌕</span>
          <input type="search" id="searchInput" placeholder="Search tasks… (/)" aria-label="Search tasks" />
        </div>
        <div class="toolbar-row">
          <div class="chip-group" id="categoryChips" role="group" aria-label="Filter by category"></div>
          <select id="sortSelect" class="toolbar-select" aria-label="Sort tasks">
            <option value="time">Sort: Time</option>
            <option value="priority">Sort: Priority</option>
            <option value="alpha">Sort: A–Z</option>
            <option value="status">Sort: Status</option>
            <option value="manual">Sort: Manual</option>
          </select>
        </div>
      </section>

      <main class="punchlist" id="dayView">
        <div class="punchlist-header">
          <span class="col-no">NO.</span>
          <span class="col-check">✓</span>
          <span class="col-task">TASK</span>
          <span class="col-time">TIME</span>
        </div>
        <div class="punchlist-body" id="taskList"></div>
        <p class="empty-state" id="emptyState">No items logged for this sheet.<br>Tap <strong>+ LOG ITEM</strong> to add one.</p>
      </main>

      <div class="week-view" id="weekView" hidden></div>
      <div class="timeline-view" id="timelineView" hidden></div>
    </div>
  </div>

  <button class="fab" id="addTaskBtn" aria-label="Log new task">+</button>
  <button class="install-btn" id="installBtn" hidden>APPROVED FOR FIELD USE — Install App</button>
</div>

<div class="reminder-banner" id="reminderBanner" role="alert" hidden>
  <span class="reminder-icon">⏰</span>
  <span id="reminderText"></span>
  <button id="snoozeReminder" class="btn-snooze">Snooze 10m</button>
  <button id="dismissReminder" aria-label="Dismiss reminder">✕</button>
</div>

<div class="snackbar" id="snackbar" hidden>
  <span id="snackbarText"></span>
  <button type="button" id="snackbarUndo">Undo</button>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <form class="modal" id="taskForm">
    <h2 id="modalTitle">Log Item</h2>

    <div class="template-row" id="templateRow">
      <select id="templateSelect" aria-label="Start from template">
        <option value="">Start from template…</option>
      </select>
      <button type="button" id="saveTemplateBtn" class="btn-ghost btn-small" title="Save current form as a template">💾</button>
      <button type="button" id="deleteTemplateBtn" class="btn-ghost btn-small" title="Delete selected template" hidden>🗑</button>
    </div>

    <label>Task
      <input type="text" id="taskTitle" required maxlength="120" placeholder="e.g. Submit HVAC load calc" />
    </label>

    <div class="field-row">
      <label>Date
        <input type="date" id="taskDate" />
      </label>
      <label>Time <span class="optional">(optional)</span>
        <input type="time" id="taskTime" />
      </label>
    </div>

    <div class="field-row">
      <label>Category
        <select id="taskCategory">
          <option value="work">Work</option>
          <option value="personal">Personal</option>
          <option value="urgent">Urgent</option>
          <option value="health">Health</option>
          <option value="errands">Errands</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Priority
        <select id="taskPriority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
    </div>

    <label>Repeat
      <select id="taskRepeat">
        <option value="none">Does not repeat</option>
        <option value="daily">Daily</option>
        <option value="weekdays">Weekdays (Mon–Fri)</option>
        <option value="weekly">Weekly</option>
      </select>
    </label>

    <label class="checkbox-row">
      <input type="checkbox" id="taskReminder" checked />
      Alert me at this time
    </label>

    <label>Notes <span class="optional">(optional)</span>
      <textarea id="taskNotes" maxlength="300" rows="2" placeholder="Add details…"></textarea>
    </label>

    <div class="subtask-field">
      <span class="subtask-field-label">Subtasks <span class="optional">(optional)</span></span>
      <div id="subtaskList" class="subtask-list"></div>
      <div class="subtask-add-row">
        <input type="text" id="subtaskInput" maxlength="80" placeholder="Add a subtask" />
        <button type="button" id="addSubtaskBtn" class="btn-ghost btn-small">Add</button>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" id="cancelTask" class="btn-ghost">Cancel</button>
      <button type="submit" class="btn-solid">Save item</button>
    </div>
  </form>
</div>

<div class="confirm-overlay" id="confirmOverlay" hidden>
  <div class="confirm-box" role="alertdialog" aria-modal="true">
    <p id="confirmMessage">Are you sure?</p>
    <div class="confirm-actions" id="confirmActions"></div>
  </div>
</div>

<div class="report-overlay" id="reportOverlay" hidden>
  <div class="report-box" role="dialog" aria-modal="true" aria-label="Weekly review">
    <div class="report-header">
      <h2>Weekly Review</h2>
      <button type="button" id="closeReport" aria-label="Close">✕</button>
    </div>
    <div class="report-body" id="reportBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
