<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#173350" />
<title>Daily Log — Task Tracker &amp; Planner</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <header class="titleblock">
    <div class="tb-nav">
      <button id="prevMonth" class="tb-arrow" aria-label="Previous month">‹</button>
      <button id="monthYearBtn" class="tb-monthyear" aria-label="Jump to today">
        <span id="monthLabel">AUGUST</span>
        <span id="yearLabel">2026</span>
      </button>
      <button id="nextMonth" class="tb-arrow" aria-label="Next month">›</button>
    </div>
    <div class="tb-cells">
      <div class="tb-cell">
        <span class="tb-cell-label">SHEET</span>
        <span class="tb-cell-value" id="sheetDate">—</span>
      </div>
      <div class="tb-cell">
        <span class="tb-cell-label">DAY</span>
        <span class="tb-cell-value" id="sheetDay">—</span>
      </div>
      <div class="tb-cell tb-cell-status">
        <span class="tb-cell-label">STATUS</span>
        <span class="tb-cell-value" id="sheetStatus">0/0 DONE</span>
      </div>
    </div>
  </header>

  <button class="notify-pill" id="notifyPill" hidden>🔔 Enable reminder notifications</button>

  <section class="calendar" id="calendarSection">
    <div class="calendar-weekdays">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </section>
  <button class="calendar-toggle" id="calendarToggle">Hide calendar ▲</button>

  <main class="punchlist">
    <div class="punchlist-header">
      <span class="col-no">NO.</span>
      <span class="col-check">✓</span>
      <span class="col-task">TASK</span>
      <span class="col-time">TIME</span>
    </div>
    <div class="punchlist-body" id="taskList"></div>
    <p class="empty-state" id="emptyState">No items logged for this sheet.<br>Tap <strong>+ LOG ITEM</strong> to add one.</p>
  </main>

  <button class="fab" id="addTaskBtn" aria-label="Log new task">+</button>
  <button class="install-btn" id="installBtn" hidden>APPROVED FOR FIELD USE — Install App</button>
</div>

<div class="reminder-banner" id="reminderBanner" role="alert" hidden>
  <span class="reminder-icon">⏰</span>
  <span id="reminderText"></span>
  <button id="dismissReminder" aria-label="Dismiss reminder">✕</button>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <form class="modal" id="taskForm">
    <h2>Log Item</h2>
    <label>Task
      <input type="text" id="taskTitle" required maxlength="120" placeholder="e.g. Submit HVAC load calc" />
    </label>
    <label>Time <span class="optional">(optional)</span>
      <input type="time" id="taskTime" />
    </label>
    <label class="checkbox-row">
      <input type="checkbox" id="taskReminder" checked />
      Alert me at this time
    </label>
    <div class="modal-actions">
      <button type="button" id="cancelTask" class="btn-ghost">Cancel</button>
      <button type="submit" class="btn-solid">Save item</button>
    </div>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
